name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy zendriver_mcp

      - name: Pytest
        run: uv run pytest -q

      - name: Tool reference is current
        run: uv run python scripts/gen_tool_docs.py --check

  live:
    # End to end against a real, headed Chrome under Xvfb: trusted input, no DOM
    # markers, stale ids, tab handles, batch, artifacts (tests/test_live.py).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Live test
        env:
          ZENDRIVER_MCP_LIVE: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" uv run pytest -q tests/test_live.py
