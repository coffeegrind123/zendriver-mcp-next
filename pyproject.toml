[project]
name = "zendriver-mcp-next"
version = "0.5.0"
description = "An MCP server that gives AI agents a real, headed Chrome that pages cannot tell is automated."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "browser-automation", "chrome", "cdp", "zendriver", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # Tested against 0.17 (CDP bindings for Chrome 150+).
    "zendriver>=0.17",
    # Direct, not transitive-via-zendriver: zendriver_mcp/launch.py constructs the
    # Browser itself (the only way to watch the child process during startup)
    # and so has to register the shutdown hook Browser.create would have.
    "asyncio-atexit>=1.0",
    # 2.3 is the first SDK that serves the 2026-07-28 protocol and the
    # 2024-11-05..2025-11-25 handshake versions from one server. <3 because a
    # major release renamed FastMCP and Tool.inputSchema last time.
    "mcp>=2.3,<3",
    "Pillow",
    # Imported directly for the HTTP transport (also pulled in by mcp).
    "starlette>=0.27",
    "uvicorn>=0.31.1",
]

[project.urls]
Homepage = "https://github.com/coffeegrind123/zendriver-mcp-next"
Documentation = "https://github.com/coffeegrind123/zendriver-mcp-next/tree/main/docs"
Issues = "https://github.com/coffeegrind123/zendriver-mcp-next/issues"
Changelog = "https://github.com/coffeegrind123/zendriver-mcp-next/blob/main/CHANGELOG.md"

[project.scripts]
zendriver-mcp = "zendriver_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=8.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["zendriver_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line-too-long (docstrings/Field descriptions are intentionally long)
    "UP031",  # legacy %-formatting in the extension-provisioning code is fine
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Chrome still sends deprecated Page events (downloadWillBegin/downloadProgress,
# frameScheduledNavigation/frameClearedScheduledNavigation) whenever the Page
# domain is on, which dialog handling needs, and zendriver's CDP parser warns
# once per event it parses. Not our code and not avoidable from here; the
# server uses none of these events.
filterwarnings = [
    "ignore:Call to deprecated class DownloadWillBegin:DeprecationWarning",
    "ignore:Call to deprecated class DownloadProgress:DeprecationWarning",
    "ignore:Call to deprecated class FrameScheduledNavigation:DeprecationWarning",
    "ignore:Call to deprecated class FrameClearedScheduledNavigation:DeprecationWarning",
]
