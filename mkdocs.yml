site_name: Zendriver MCP
site_description: An MCP server that gives AI agents a real, headed Chrome that pages cannot tell is automated.
repo_url: https://github.com/coffeegrind123/zendriver-mcp-next
repo_name: coffeegrind123/zendriver-mcp-next
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Match system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tool reference: tools.md
  - Architecture: architecture.md
  - Recipes:
      - Work a long page: recipes/long-pages.md
      - Get past a Cloudflare challenge: recipes/beat-cloudflare.md
      - Mock an API response: recipes/mock-api-responses.md
      - Audit a page behind a login: recipes/performance-audit.md
      - Log in once, reuse the session: recipes/scrape-behind-login.md
